  <link rel="stylesheet" href="/styles.css">
  <script>
    // Aplica el estado del sidebar antes de pintar (evita parpadeo)
    // Menú lateral: 'auto' (se abre al pasar el mouse, por defecto) o 'fijo' (siempre abierto)
    (function () { let m = 'auto'; try { m = localStorage.getItem('tup.menu') === 'fijo' ? 'fijo' : 'auto'; } catch {} document.documentElement.classList.add('sb-' + m); })();
  </script>
</head>
<body>
  <header class="topbar no-print">
    <button class="icon-btn" id="sbOpen" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a href="#/" class="top-logo"><img src="/logo.png" alt="Transportes UP Cartagena"></a>
    <a href="#/bitacora/nueva" class="icon-btn add" aria-label="Nueva bitácora">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </a>
  </header>

  <div class="scrim no-print" id="scrim" hidden></div>

  <aside class="sidebar no-print" id="sidebar" aria-label="Menú principal">
    <div class="sb-head">
      <a href="#/" class="brand"><img class="logo-full" src="/logo.png" alt="Transportes UP Cartagena"><img class="logo-mini" src="/logo-icon.png" alt=""></a>
    </div>
    <nav>
      <a href="#/" data-nav="dashboard" title="Dashboard">
        <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zm0 7h6v-5H4zm10 0h6v-9h-6zm0-16v5h6V4z"/></svg><span>Dashboard</span></a>
      <a href="#/clientes" data-nav="clientes" title="Clientes">
        <svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 1a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm8 1c-2.7 0-8 1.3-8 4v3h16v-3c0-2.7-5.3-4-8-4zm-8 0c-.3 0-.7 0-1.1.1A4.7 4.7 0 0 1 9 17v3H1v-3c0-2.2 4.4-4 7-4z"/></svg><span>Clientes</span></a>
      <a href="#/registros" data-nav="registros" title="Registros">
        <svg viewBox="0 0 24 24"><path d="M3 5h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zm-4 6h2v2H3zm4 0h14v2H7z"/></svg><span>Registros</span></a>
      <a href="#/bitacoras" data-nav="bitacoras" title="Bitácoras">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-1 7V3.5L18.5 9zM8 13h8v2H8zm0 4h8v2H8z"/></svg><span>Bitácoras</span></a>
      <a href="#/agenda" data-nav="agenda" title="Agenda de firmas">
        <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14zM7 12h5v5H7z"/></svg><span>Agenda de firmas</span></a>
      <a href="#/config" data-nav="config" title="Campos fijos">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 3.5-3.5 3.5 3.5 0 0 1-3.5 3.5z"/></svg><span>Campos fijos</span></a>
    </nav>
    <div class="side-foot"><span id="vivo" class="vivo"><i>○</i><b>Conectando…</b></span><span>Salud Total EPS · NIT <b id="nit"></b></span></div>
    <button class="pin-btn" id="sbPin" title="Fijar el menú abierto o dejar que se abra al pasar el mouse">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 3a1 1 0 0 1 .7 1.7L15.4 6l2.3 4.6 1.6.3a1 1 0 0 1 .5 1.7l-3.1 3.1 4 4a1 1 0 1 1-1.4 1.4l-4-4-3.1 3.1a1 1 0 0 1-1.7-.5l-.3-1.6L5.6 15l-1.3 1.3a1 1 0 0 1-1.4-1.4l3.6-3.6a1 1 0 0 1 1.3-.1l5.3-5.3a1 1 0 0 1 .1-1.3l2.1-2.1A1 1 0 0 1 16 3z"/></svg>
      <span id="sbPinTxt">Fijar menú abierto</span>
    </button>
  </aside>

  <main id="app"></main>
  <div id="modal" class="modal no-print" hidden role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast no-print" hidden role="status" aria-live="polite"></div>
  <div id="demo" class="demo-banner no-print" hidden role="status">⚠️ <b>Modo demostración</b>: este despliegue aún no tiene almacenamiento permanente; los datos y firmas se pueden perder.</div>
  <div id="live" class="live-banner no-print" hidden role="status">🔄 Otra persona actualizó la información <button class="btn sm primary" id="liveBtn">Actualizar</button></div>

  <script src="/firma.js"></script>
  <script src="/lote.js"></script>
  <script src="/app.js"></script>
  <script>
    // Sidebar: drawer en móvil, colapsable (solo iconos) en escritorio
    (function () {
      const root = document.documentElement, sb = document.getElementById('sidebar'), scrim = document.getElementById('scrim'), open = document.getElementById('sbOpen');
      const setDrawer = on => { root.classList.toggle('sb-open', on); scrim.hidden = !on; open.setAttribute('aria-expanded', on); };
      open.onclick = () => setDrawer(true);
      scrim.onclick = () => setDrawer(false);
      sb.addEventListener('click', e => {
        const link = e.target.closest('nav a, .brand'); if (!link) return;
        setDrawer(false);
        if (e.detail > 0) link.blur(); // clic con mouse: soltar el foco para que el menú automático se recoja al salir
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') { setDrawer(false); if (!document.getElementById('modal').hidden) closeModal(); } });
      const pin = document.getElementById('sbPin'), pinTxt = document.getElementById('sbPinTxt');
      const pintarPin = () => { const fijo = root.classList.contains('sb-fijo'); pinTxt.textContent = fijo ? 'Menú fijo · soltar' : 'Fijar menú abierto'; pin.setAttribute('aria-pressed', fijo); };
      pin.onclick = () => {
        const fijo = !root.classList.contains('sb-fijo');
        root.classList.toggle('sb-fijo', fijo); root.classList.toggle('sb-auto', !fijo);
        try { localStorage.setItem('tup.menu', fijo ? 'fijo' : 'auto'); } catch {}
        pintarPin(); if (!fijo) pin.blur(); // al soltar, que se recoja de inmediato
      };
      pintarPin();
    })();
    // Recarga en vivo: el servidor avisa cuando cambia algo en /public
    (function () {
      if (location.search.includes('noreload')) return;
      if (!/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)) return; // solo en desarrollo local
      const es = new EventSource('/__reload');
      es.onmessage = e => { if (e.data === 'reload') location.reload(); };
    })();
  </script>
</body>
</html>
